name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      eval_suite:
        description: "Run a real-model eval (spends API money)"
        type: choice
        options: [none, analysis, e2e, sql]
        default: none
      k:
        description: "Repeats per case"
        default: "3"

# a newer push to the same branch makes an older run's result moot: cancel it (12 pushes in one
# domain queued 12 runs of ~25 min)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:   # Phase 4: SQL eval gates and the read-only execution tests run against it
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: analystai_eval
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_URL: postgresql+psycopg://postgres:postgres@localhost:5432/analystai_eval
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      # no secrets: the autouse RecordedClient makes model calls impossible; parallel: each
      # worker gets its own scratch database (tests/conftest.py _worker_database)
      - run: uv run pytest -q -n auto
      # The stores again on asyncpg, production's driver (docker-compose): it rejects an aware
      # datetime for a naive column, which psycopg accepts silently.
      - run: uv run pytest -q -n auto tests/test_deletion.py tests/test_workspace_store.py tests/test_run_store.py tests/test_durable_runs.py tests/test_workspace_perf.py
        env:
          TEST_PG_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/analystai_eval

  # Phase 5.7: every finished domain's deterministic suites, $0 (no model call), on every push.
  zero-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen --extra dev
      - run: uv run python -m evals.run visualization --k 1 --max-usd 0.01 --fail-under 1.0
      - run: uv run python -m evals.run cleaning --k 1 --max-usd 0.01 --fail-under 1.0
      - run: uv run python -m evals.run ingestion --k 1 --max-usd 0.01 --fail-under 1.0
      # 6 of 40 defects only the critic can label; the checks alone have held 0.85 since Phase 5.
      - run: uv run python -m evals.run quality --checks-only --k 1 --max-usd 0.01 --fail-under 0.85

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: node --experimental-strip-types --test src/lib/*.test.ts   # pure helpers
      # Phase 5.6a: dropped stream + reopened tab replay every event once (mock backend, $0)
      - run: npx playwright install --with-deps chromium
      # the dashboard fixtures (git-ignored, $0): the real pack output on the eval data
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv run python scripts/ui_check/make_fixture.py scripts/ui_check/fixtures --dashboard-only
        working-directory: .
      - run: npx playwright test

  evals:
    if: github.event_name == 'workflow_dispatch' && inputs.eval_suite != 'none'
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:   # Phase 4: SQL eval gates and the read-only execution tests run against it
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: analystai_eval
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_URL: postgresql+psycopg://postgres:postgres@localhost:5432/analystai_eval
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - env:
          SUITE: ${{ inputs.eval_suite }}
          K: ${{ inputs.k }}
        run: uv run python -m evals.run "$SUITE" --k "$K"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ inputs.eval_suite }}
          path: evals/reports/
