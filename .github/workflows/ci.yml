name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      eval_suite:
        description: "Run a real-model eval (spends API money)"
        type: choice
        options: [none, analysis, e2e, sql]
        default: none
      k:
        description: "Repeats per case"
        default: "3"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:   # Phase 4: SQL eval gates and the read-only execution tests run against it
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: analystai_eval
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_URL: postgresql+psycopg://postgres:postgres@localhost:5432/analystai_eval
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q   # no secrets: the autouse RecordedClient makes model calls impossible

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  evals:
    if: github.event_name == 'workflow_dispatch' && inputs.eval_suite != 'none'
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:   # Phase 4: SQL eval gates and the read-only execution tests run against it
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: analystai_eval
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_URL: postgresql+psycopg://postgres:postgres@localhost:5432/analystai_eval
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - env:
          SUITE: ${{ inputs.eval_suite }}
          K: ${{ inputs.k }}
        run: uv run python -m evals.run "$SUITE" --k "$K"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ inputs.eval_suite }}
          path: evals/reports/
