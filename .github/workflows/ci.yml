name: CI

# one run per change: a pull request runs on its PR; a push runs only on main (a branch with a
# PR ran CI twice per push, the push run and the PR run)
on:
  push:
    branches: [main]
  pull_request:
  # nightly: the same suite in a shuffled order (TEST_ORDER_SEED, tests/conftest.py), so a test
  # that passes only after another one created its state fails here before it fails a PR
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      eval_suite:
        description: "Run a real-model eval (spends API money)"
        type: choice
        options: [none, analysis, e2e, sql]
        default: none
      k:
        description: "Repeats per case"
        default: "3"

# a newer push to the same branch makes an older run's result moot: cancel it (12 pushes in one
# domain queued 12 runs of ~25 min)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # 4 jobs at once, each a quarter of the tests (tests/conftest.py CI_SHARD): a runner has 4
    # slow cores, so one job took 19 min even with -n auto
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:   # Phase 4: SQL eval gates and the read-only execution tests run against it
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: analystai_eval
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:      # Phase 5.8a: the MySQL source (oracle, read-only and guard tests)
        image: mysql:8.4   # pinned: mysql:latest is 26.x (Metabase's CI broke on it)
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: analystai_eval
        ports: ["3306:3306"]
        # a real query over TCP: `mysqladmin ping` answers the image's init server before it's ready
        options: >-
          --health-cmd "mysql -h127.0.0.1 -uroot -pmysql -e 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:    # Phase 5.8b (the same pins as scripts/test_dbs.sh)
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: mariadb
        ports: ["3307:3306"]
        options: >-
          --health-cmd "mariadb -h127.0.0.1 -uroot -pmariadb -e 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mssql:      # Phase 5.8b; tests/conftest.py creates the database and the reader/writer logins
        image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          # made per run, never a literal in the history (5.8b: gitleaks caught the first one)
          MSSQL_SA_PASSWORD: Aai-${{ github.run_id }}-${{ github.run_attempt }}x
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Aai-${{ github.run_id }}-${{ github.run_attempt }}x -Q 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 40
    env:
      TEST_PG_URL: postgresql+psycopg://postgres:postgres@localhost:5432/analystai_eval
      TEST_MYSQL_URL: mysql+pymysql://root:mysql@127.0.0.1:3306/analystai_eval
      TEST_MARIADB_URL: mariadb+pymysql://root:mariadb@127.0.0.1:3307/analystai_eval
      TEST_MSSQL_URL: mssql+pyodbc://sa:Aai-${{ github.run_id }}-${{ github.run_attempt }}x@127.0.0.1:1433/analystai_eval?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      TEST_MSSQL_READER_URL: mssql://aai_reader:Aai-${{ github.run_id }}-${{ github.run_attempt }}x@127.0.0.1:1433/analystai_eval?TrustServerCertificate=yes
      TEST_MSSQL_WRITER_URL: mssql://aai_writer:Aai-${{ github.run_id }}-${{ github.run_attempt }}x@127.0.0.1:1433/analystai_eval?TrustServerCertificate=yes
      CI_SHARD: ${{ matrix.shard }}/4
      TEST_ORDER_SEED: ${{ github.event_name == 'schedule' && github.run_id || '' }}
      # nightly: the property tests' 500-example profile (tests/conftest.py); else 25, derandomized
      HYPOTHESIS_PROFILE: ${{ github.event_name == 'schedule' && 'deep' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tests/test_retro_ledger.py reads the retro commits (37 MB)
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      # SQL Server's driver (pyodbc needs Microsoft's ODBC Driver 18; the runner image may carry it)
      - run: odbcinst -q -d | grep -q "ODBC Driver 18" || (curl -sSL https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb -o /tmp/ms.deb && sudo dpkg -i /tmp/ms.deb && sudo apt-get update -q && sudo ACCEPT_EULA=Y apt-get install -yq msodbcsql18 unixodbc)
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run lint-imports   # domain_pack layers; the reference oracle never reads the product
      # no secrets: the autouse RecordedClient makes model calls impossible; parallel: each
      # worker gets its own scratch database (tests/conftest.py _worker_database)
      - run: uv run pytest -q -n auto
      # The stores again on asyncpg, production's driver (docker-compose): it rejects an aware
      # datetime for a naive column, which psycopg accepts silently.
      - if: matrix.shard == 0
        run: uv run pytest -q -n auto tests/test_deletion.py tests/test_workspace_store.py tests/test_run_store.py tests/test_durable_runs.py tests/test_workspace_perf.py
        env:
          TEST_PG_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/analystai_eval
          CI_SHARD: ""

  # Phase 5.8a: no secret (a connection string with a password, a key) enters the history;
  # dependencies with a known vulnerability are listed (pip-audit reports, not yet blocking:
  # 14 locked packages had advisories at 5.8a; the upgrade is its own PR before v0.1).
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # the token handed to a third-party action can only read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # third-party actions pinned to a commit (a moved tag can't swap the code that sees the token)
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7   # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e   # v6
        with:
          python-version: "3.11"
      - run: uv export --frozen --no-hashes --no-emit-project --format requirements-txt -o req.txt
      - run: uvx pip-audit -r req.txt --disable-pip --no-deps
        continue-on-error: true

  # Phase 5.7: every finished domain's deterministic suites, $0 (no model call), on every push.
  zero-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the mutation gate diffs against the merge-base with main
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen --extra dev
      # the pre-push hook's mutation gate again: the hook is opt-in and --no-verify skips it
      - run: uv run python scripts/mutation.py --check "$(git merge-base HEAD origin/main)"
      - run: uv run python -m evals.run visualization --k 1 --max-usd 0.01 --fail-under 1.0
      - run: uv run python -m evals.run cleaning --k 1 --max-usd 0.01 --fail-under 1.0
      - run: uv run python -m evals.run ingestion --k 1 --max-usd 0.01 --fail-under 1.0
      # 6 of 40 defects only the critic can label; the checks alone have held 0.85 since Phase 5.
      - run: uv run python -m evals.run quality --checks-only --k 1 --max-usd 0.01 --fail-under 0.85

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: node --experimental-strip-types --test src/lib/*.test.ts   # pure helpers
      # Phase 5.6a: dropped stream + reopened tab replay every event once (mock backend, $0)
      - run: npx playwright install --with-deps chromium
      # the mock API and the dashboard fixtures (git-ignored, $0, built by e2e/global-setup.ts)
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: npx playwright test

  evals:
    if: github.event_name == 'workflow_dispatch' && inputs.eval_suite != 'none'
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:   # Phase 4: SQL eval gates and the read-only execution tests run against it
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: analystai_eval
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_URL: postgresql+psycopg://postgres:postgres@localhost:5432/analystai_eval
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - env:
          SUITE: ${{ inputs.eval_suite }}
          K: ${{ inputs.k }}
        run: uv run python -m evals.run "$SUITE" --k "$K"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ inputs.eval_suite }}
          path: evals/reports/
