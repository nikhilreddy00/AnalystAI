[project]
name = "analystai"
version = "0.1.0"
description = "Multi-agent AI system that replaces a data analyst"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "langgraph>=0.2",
    "anthropic>=0.40",
    "e2b-code-interpreter>=1.0",
    "qdrant-client>=1.9",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "numpy>=1.26",
    "gspread>=6.0",
    "google-auth>=2.29",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "pyarrow>=16.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "slowapi>=0.1.9",
    "chardet>=5.2",
    "python-pptx>=1.0.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "sqlglot>=25",
    "psycopg[binary]>=3.2",
    "langgraph-checkpoint-postgres>=3.2.0",
    "greenlet>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "hypothesis==6.170.15",
    "import-linter==2.16",
    "mutmut==3.8.1",
    "pytest-xdist>=3.8.0",
]

[tool.mutmut]
# Run only through scripts/mutation.py: it works in a throwaway worktree and adds the tests.
# mutmut copies only these into mutants/ and drops the repo root from sys.path, so every
# module the tests import is copied too (and domain_packs/, read via Path(__file__)).
source_paths = ["domain_pack.py"]
also_copy = ["agents/", "api/", "connectors/", "domain_packs/", "evals/", "llm/", "memory/",
             "orchestrator/", "prompts/", "sandbox/", "scripts/", "semantic_layers/", "worker/",
             "guardrails.py", "semantic_layer.py"]
