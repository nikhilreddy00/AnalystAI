[project]
name = "analystai"
version = "0.1.0"
description = "Multi-agent AI system that replaces a data analyst"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "langgraph>=0.2",
    "anthropic>=0.40",
    "e2b-code-interpreter>=1.0",
    "qdrant-client>=1.9",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "numpy>=1.26",
    "gspread>=6.0",
    "google-auth>=2.29",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "pyarrow>=16.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "slowapi>=0.1.9",
    "chardet>=5.2",
    "python-pptx>=1.0.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "sqlglot>=25",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
