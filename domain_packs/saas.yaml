:business|company))\b(?:[^.]|\.\d){0,60}\b(?:NRR|GRR|NDR|net (?:revenue|dollar) retention|gross (?:revenue|dollar) retention|logo churn|churn|retention)\b|\b(?:NRR|GRR|NDR|net (?:revenue|dollar) retention|gross (?:revenue|dollar) retention|logo churn|churn|retention)\b(?:[^.]|\.\d){0,60}\b(?:best[- ]in[- ]class|world[- ]class|top[- ]quartile(?!\s+(?:accounts|customers|cohorts?|segments?|plans?|deals?|logos))|industry[- ]leading|above (?:the )?benchmark|below (?:the )?benchmark|(?:above|below) (?:the )?(?:\w+ )?(?:median|average|norm|benchmark)|(?:weaker|stronger|healthier|better|worse) than (?:the )?(?:\w+ )?(?:median|average|benchmark|peers|industry)|for a SaaS (?:business|company)|by SaaS standards|(?:compares?|compared) (?:well|poorly|favou?rably|unfavou?rably) (?:with|to)|(?:compared with|versus|vs\.?) (?:industry |sector |SaaS |the )?(?:benchmarks?|peers)|healthy (?:business|company))\b',
     reason: "a benchmark verdict: benchmarks differ by the population surveyed (ChartMogul's and SaaS Capital's median NRR are far apart); quote one with its source, never as a grade"}
