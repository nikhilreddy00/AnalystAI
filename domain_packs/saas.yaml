  - {q: "What are net and gross revenue retention, by segment?", needs: [nrr, segment]}
  - {q: "What is logo churn over the last 12 months, and how many customers churned by month?", needs: [logo_churn_rate]}
  - {q: "What is ARPA by plan?", needs: [arpa, plan]}
  - {q: "How many customers did we win, lose and win back?", needs: [new_customers, reactivated_customers]}
