  source_sql: SELECT c.region, SUM(oi.quantity * oi.unit_price) AS revenue FROM shop.orders o JOIN shop.customers
    c ON c.customer_id = o.customer_id JOIN shop.order_items oi ON oi.order_id = o.order_id GROUP BY c.region
