id: retail-metric-02
domain: retail
category: metric
question: What were sales by region in fiscal year 2025? Leave out customers with no region.
golden_sql: |
  SELECT c.region, SUM(oi.quantity * oi.unit_price * (1 - oi.discount_pct)) FILTER (WHERE o.status = 'completed') AS sales
  FROM shop.order_items oi
  JOIN shop.orders o ON o.order_id = oi.order_id
  JOIN shop.customers c ON c.customer_id = o.customer_id
  JOIN shop.dim_date d ON d.date_day = o.order_date
  WHERE d.fiscal_year = 2025 AND c.region IS NOT NULL
  GROUP BY c.region
trap_sql: |
  SELECT c.region, SUM(oi.quantity * oi.unit_price * (1 - oi.discount_pct)) FILTER (WHERE o.status = 'completed') AS sales
  FROM shop.order_items oi
  JOIN shop.orders o ON o.order_id = oi.order_id
  JOIN shop.customers c ON c.customer_id = o.customer_id
  WHERE o.order_date >= DATE '2025-01-01' AND o.order_date < DATE '2026-01-01'
    AND c.region IS NOT NULL
  GROUP BY c.region
metric: net_revenue
