id: retail-metric-not-01
domain: retail
category: metric_not
question: 'What was gross revenue in calendar year 2025: quantity times list price, before any discount,
  counting every order whatever its status (including refunded and cancelled)?'
golden_sql: |
  SELECT SUM(oi.quantity * oi.unit_price) FROM shop.order_items oi
  JOIN shop.orders o ON o.order_id = oi.order_id
  WHERE o.order_date >= DATE '2025-01-01' AND o.order_date < DATE '2026-01-01'
trap_sql: |
  SELECT SUM(oi.quantity * oi.unit_price * (1 - oi.discount_pct)) FILTER (WHERE o.status = 'completed') FROM shop.order_items oi JOIN shop.orders o ON o.order_id = oi.order_id
  WHERE o.order_date >= DATE '2025-01-01' AND o.order_date < DATE '2026-01-01'
