id: retail-join-06
domain: retail
category: join
question: How much discount did we give in USD (quantity x unit price x discount) on completed orders,
  by customer segment?
golden_sql: |
  SELECT c.segment, SUM(oi.quantity * oi.unit_price * oi.discount_pct) AS discount_usd
  FROM shop.order_items oi
  JOIN shop.orders o ON o.order_id = oi.order_id
  JOIN shop.customers c ON c.customer_id = o.customer_id
  WHERE o.status = 'completed'
  GROUP BY c.segment
