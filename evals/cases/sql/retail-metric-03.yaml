id: retail-metric-03
domain: retail
category: metric
question: What was turnover by sales channel in fiscal Q3 of fiscal year 2026?
golden_sql: |
  SELECT o.channel, SUM(oi.quantity * oi.unit_price * (1 - oi.discount_pct)) FILTER (WHERE o.status = 'completed') AS turnover
  FROM shop.order_items oi
  JOIN shop.orders o ON o.order_id = oi.order_id
  JOIN shop.dim_date d ON d.date_day = o.order_date
  WHERE d.fiscal_year = 2026 AND d.fiscal_quarter = 3
  GROUP BY o.channel
trap_sql: |
  SELECT o.channel, SUM(oi.quantity * oi.unit_price * (1 - oi.discount_pct)) FILTER (WHERE o.status = 'completed') AS turnover
  FROM shop.order_items oi JOIN shop.orders o ON o.order_id = oi.order_id
  WHERE o.order_date >= DATE '2025-07-01' AND o.order_date < DATE '2025-10-01'
  GROUP BY o.channel
metric: net_revenue
