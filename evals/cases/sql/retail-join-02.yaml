id: retail-join-02
domain: retail
category: join
question: Total units sold per product category on completed orders.
golden_sql: |
  SELECT p.category, SUM(oi.quantity) AS units
  FROM shop.order_items oi
  JOIN shop.orders o ON o.order_id = oi.order_id
  JOIN shop.products p ON p.product_id = oi.product_id
  WHERE o.status = 'completed'
  GROUP BY p.category
trap_sql: |
  SELECT p.category, SUM(oi.quantity) AS units
  FROM shop.order_items oi JOIN shop.products p ON p.product_id = oi.product_id
  GROUP BY p.category
