id: retail-join-07
domain: retail
category: join
question: How many orders (any status) did enterprise customers place in calendar year 2025?
golden_sql: |
  SELECT COUNT(*) FROM shop.orders o JOIN shop.customers c ON c.customer_id = o.customer_id
  WHERE c.segment = 'enterprise'
    AND o.order_date >= DATE '2025-01-01' AND o.order_date < DATE '2026-01-01'
