id: e2e-43
domain: banking
dataset:
  name: loan_tape
  seed: 1
question: Give me an overview of this dataset.
overview_done: false
trap: true
checks:
- kind: findings
  check: eda_stat
  column: Interest Rate (%)
  stats:
  - mean
  - median
  rel_tol: 0.02
- kind: must_not_number
  truth_key: naive_balance_sum
  rel_tol: 0.01
  scope: report
- kind: must_not_number
  truth_key: npl_count_pct
  rel_tol: 0.005
  unit: '%'
- kind: must_match
  pattern: as of 31 Oct 2026|as of October 31,? 2026
  scope: report
- kind: must_not_match
  pattern: net sales|order value|basket|\bunits sold|\bSKU
  scope: report
hard_rules:
- charts_lint_clean
- charts_have_rationale
- non_empty_or_error
- insight_grounded
- insight_dates_in_range
- executive_no_jargon
- claims_cite_evidence
label_note: 'A loan tape: the balance is a level (never summed over 14 month-ends); NPL by balance, not
  count.'
