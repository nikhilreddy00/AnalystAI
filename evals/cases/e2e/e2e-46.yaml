id: e2e-46
domain: banking
dataset:
  name: card_ledger
  seed: 1
question: Give me an overview of this dataset.
overview_done: false
trap: true
checks:
- kind: findings
  check: eda_stat
  column: Amount
  stats:
  - median
  rel_tol: 0.02
- kind: must_not_number
  truth_key: fee_income_naive
  rel_tol: 0.005
  scope: report
- kind: must_not_number
  truth_key: naive_balance_after_sum
  rel_tol: 0.01
  scope: report
- kind: must_match
  pattern: revers
  scope: report
- kind: must_not_match
  pattern: net sales|order value|basket|\bunits sold|\bSKU
  scope: report
hard_rules:
- charts_lint_clean
- charts_have_rationale
- non_empty_or_error
- insight_grounded
- insight_dates_in_range
- executive_no_jargon
- claims_cite_evidence
