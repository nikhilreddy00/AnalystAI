id: e2e-35
domain: retail
dataset:
  name: retail_lines
  seed: 1
question: Give me an overview of this dataset.
overview_done: false
trap: true
checks:
- kind: findings
  check: eda_stat
  column: Lineitem quantity
  stats:
  - mean
  - median
  rel_tol: 0.02
- kind: must_not_number
  truth_key: naive_aov_per_line
  rel_tol: 0.005
  scope: report
- kind: must_not_number
  truth_key: naive_total_fanout
  rel_tol: 0.005
  scope: report
- kind: must_not_match
  pattern: \b(discount|promo\w*|markdown|campaign)s?\b[^.]{0,40}\b(drove|caused|boosted|lifted|fuell?ed)\b
hard_rules:
- charts_lint_clean
- charts_have_rationale
- non_empty_or_error
- insight_grounded
- insight_dates_in_range
- executive_no_jargon
- claims_cite_evidence
