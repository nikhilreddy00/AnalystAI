id: e2e-36
domain: retail
dataset:
  name: store_weeks
  seed: 1
question: Give me an overview of this dataset.
overview_done: false
trap: true
checks:
- kind: findings
  check: eda_stat
  column: Net Sales
  stats:
  - mean
  - median
  rel_tol: 0.02
- kind: must_not_number
  truth_key: naive_units
  rel_tol: 0.001
  scope: report
- kind: must_not_number   # 34.156%: written 34.2% or 34.16%; 0.15% keeps a +34.0% trend
  truth_key: naive_margin_mean_of_rows_pct   # (paid E2E gate) from colliding with the trap
  rel_tol: 0.0015
  unit: '%'
- kind: must_not_match   # ... and rounded unsigned ('34%', '34.2%'); a signed change is no margin
  pattern: (?<![+\-\d.])34(?:\.[12]\d?)?\s?%
- kind: number_in_answer
  truth_key: net_sales
  rel_tol: 0.005
- kind: must_match
  pattern: How these numbers are counted
hard_rules:
- charts_lint_clean
- charts_have_rationale
- non_empty_or_error
- insight_grounded
- insight_dates_in_range
- executive_no_jargon
- claims_cite_evidence
