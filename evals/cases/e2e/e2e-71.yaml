id: e2e-71
domain: hr
dataset:
  name: hr_roster
  seed: 1
question: Give me an overview of this dataset.
overview_done: false
trap: true
checks:
- kind: number_in_answer
  truth_key: headcount_asof
  rel_tol: 0.001
- kind: must_not_number
  truth_key: rows
  rel_tol: 0.0
  scope: report
- kind: must_not_number
  truth_key: attrition_all_rows
  rel_tol: 0.01
  scope: report
- kind: must_match
  pattern: 12 months|twelve months
  scope: report
- kind: must_not_match
  pattern: flight[- ]risk|(likely|expected) to (quit|leave|resign)|(low|lower) (salary|pay) (causes|caused|drives|leads
    to)
  scope: report
- kind: must_not_match
  pattern: net sales|order value|basket|\bSKU|outstanding balance|\bNPL\b|readmission|denial rate|loss
    ratio|premium
  scope: report
hard_rules:
- charts_lint_clean
- charts_have_rationale
- non_empty_or_error
- insight_grounded
- insight_dates_in_range
- executive_no_jargon
- claims_cite_evidence
label_note: 'Roster overview: 885 employees as of 31 Oct 2026 (people, never the 1,770 rows), attrition
  over the 12 months to then; no individual predictions or causal pay claims.'
