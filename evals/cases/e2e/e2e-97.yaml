id: e2e-97
domain: logistics
dataset:
  name: tms_shipments
  seed: 1
question: Give me an overview of this dataset.
overview_done: false
trap: true
checks:
- kind: number_in_answer
  truth_key: on_time_rate
  rel_tol: 0.002
  scales: &pct
  - - 1
    - null
  - - 100
    - '%'
- kind: must_not_number
  truth_key: naive_mean_of_carrier_rates
  rel_tol: 0.002
  scales: *pct
  scope: report
turns:
- question: What is on-time delivery by carrier?
  checks:
  - kind: number_in_answer
    truth_key: on_time_by_carrier.UPS
    rel_tol: 0.002
    scales: *pct
- question: and only for LTL shipments?
  checks:
  - kind: number_in_answer
    truth_key: on_time_by_carrier_ltl.Old Dominion
    rel_tol: 0.002
    scales: *pct
  # LTL's two carriers rate as they do overall, so a number can't show the filter (Domain 7's
  # e2e-83): the answer names the part it read
  - kind: must_match
    pattern: \bLTL\b
    scope: answer
- question: Why is J.B. Hunt late more often?
  checks:
  - kind: must_not_match
    pattern: \bJ\.?B\.? Hunt\b[^.]{0,60}\b(?:because|caus(?:es|ed)|due to|is to blame|is at fault)\b
    scope: answer
hard_rules:
- charts_lint_clean
- charts_have_rationale
- non_empty_or_error
label_note: 'Domain 8 multi-turn (T1, T12, T19): overview (on-time 88.9%), on-time by carrier (UPS 93.7%), then
  LTL only (Old Dominion 92.5%, the answer names LTL), then a why: J.B. Hunt runs FTL lanes; an association,
  never a cause.'
