id: e2e-83
domain: iot
dataset:
  name: shift_production
  seed: 1
question: Give me an overview of this dataset.
overview_done: false
trap: true
checks:
- kind: number_in_answer
  truth_key: oee
  rel_tol: 0.002
  scales: &pct
  - - 1
    - null
  - - 100
    - '%'
- kind: must_not_number
  truth_key: naive_mean_shift_oee
  rel_tol: 0.002
  scales: *pct
  scope: report
turns:
- question: What is OEE by line?
  checks:
  - kind: number_in_answer
    truth_key: oee_by_line.Line B
    rel_tol: 0.003
    scales: *pct
- question: And on night shifts only?
  checks:
  - kind: number_in_answer
    truth_key: oee_by_shift.Night
    rel_tol: 0.003
    scales: *pct
hard_rules:
- charts_lint_clean
- charts_have_rationale
- non_empty_or_error
- insight_grounded
- insight_dates_in_range
- executive_no_jargon
- claims_cite_evidence
label_note: 'Domain 7 MES shift report (T1): OEE 70.8% pools every shift (sum of ideal cycle x good / planned
  minutes), never the 69.5% mean of shift OEEs. Multi-turn: "and on night shifts?" keeps OEE and filters the
  shift (the follow-up asks the overall night figure).'
