id: e2e-106
domain: retail
source: shopify
dataset:
  name: shopify-orders
  seed: 0
  table: orders
truth:
  top_sku_units: 15
question: Which product SKU sold the most units, and how many units was that?
overview_done: true
checks:
# the SKU and its units together ('STK-001 = 15.00', 'Sticker … 15 units'): a bare 15 could be a
# day, so the number is read beside the SKU (the first run's right answer, 'STK-001 = 15.00',
# failed a check that wanted '15 units')
- kind: must_match
  pattern: (STK-001|Sticker)\D{0,40}15(\.0+)?\b
hard_rules:
- charts_lint_clean
- charts_have_rationale
- non_empty_or_error
label_note: 'Phase 5.8c: a Shopify development store (scripts/seed_shopify_test.py) imported live
  by the production engine (SHOPIFY_* in .env, never committed): STK-001 sold 5 + 10 units.'
