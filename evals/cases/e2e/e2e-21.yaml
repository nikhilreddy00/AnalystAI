id: e2e-21
domain: banking
dataset:
  name: bank_balances
  seed: 1
question: Give me an overview of this dataset.
overview_done: false
trap: true
checks:
- kind: findings
  check: eda_stat
  column: balance
  stats:
  - mean
  - median
  rel_tol: 0.02
- kind: must_not_number
  truth_key: naive_last_month_sum
  rel_tol: 0.01
- kind: must_not_number
  truth_key: naive_balance_mom_pct
  rel_tol: 0.03
  unit: '%'
- kind: must_not_number
  truth_key: naive_balance_by_segment.business
  rel_tol: 0.01
- kind: must_not_number
  truth_key: naive_balance_by_segment.retail
  rel_tol: 0.01
hard_rules:
- charts_lint_clean
- charts_have_rationale
- non_empty_or_error
- insight_grounded
- insight_dates_in_range
- executive_no_jargon
- claims_cite_evidence
