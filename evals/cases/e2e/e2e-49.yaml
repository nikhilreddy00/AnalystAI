id: e2e-49
domain: banking
dataset:
  name: loan_tape
  seed: 1
question: Give me an overview of this dataset.
overview_done: false
trap: true
checks:
- kind: findings
  check: eda_stat
  column: Interest Rate (%)
  stats:
  - mean
  rel_tol: 0.02
- kind: must_not_number
  truth_key: naive_balance_sum
  rel_tol: 0.01
  scope: report
turns:
- question: Which product has the highest 30+ day delinquency?
  checks:
  - kind: number_in_answer
    truth_key: delinq30_by_product_pct.Credit Card
    rel_tol: 0.02
    unit: '%'
- question: How does the total balance compare with October last year?
  checks:
  - kind: number_in_answer
    truth_key: balance_yoy_pct
    rel_tol: 0.03
    unit: '%'
hard_rules:
- charts_lint_clean
- charts_have_rationale
- non_empty_or_error
- insight_grounded
- insight_dates_in_range
- executive_no_jargon
- claims_cite_evidence
