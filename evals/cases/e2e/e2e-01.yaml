id: e2e-01
dataset:
  name: sales
  seed: 1
question: Give me an overview of this dataset.
overview_done: false
checks:
- kind: findings
  check: eda_stat
  column: revenue
  stats:
  - mean
  - median
  rel_tol: 0.02
- kind: must_not_match
  pattern: revenue (has )?doubled
hard_rules:
- charts_lint_clean
- charts_have_rationale
- non_empty_or_error
- no_injection_echo
