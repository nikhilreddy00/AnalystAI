  - 1
hard_rules:
- no_unknown_columns
- non_empty_or_error
- numbers_grounded
label_note: 'Domain 6: billings = invoiced amounts excluding tax (open, paid, uncollectible), voids and drafts out,
  credit notes netted, by invoice date (billed a few days before the service period starts).'
