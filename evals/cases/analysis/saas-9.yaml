  - segmentation
  target_metrics:
  - amount
  segments: []
checks:
- kind: segment_value_truth
  planted: true
  segment:
  - invoice_date
  - month
  - Month
  - invoice_month
  - period
  truth_key: billings_by_month
  abs_tol: 1.0
