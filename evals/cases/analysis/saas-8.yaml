id: saas-8
domain: saas
category: trend
pipeline: production
dataset:
  name: saas_mrr_snapshots
  seed: 1
question: How much MRR did we lose to churned customers each month over the last 12 months?
task:
  analysis_types:
  - segmentation
  target_metrics:
  - mrr
  segments: []
checks:
- kind: segment_value_truth
  planted: true
  segment:
  - month
  - Month
  - churn_month
  - period
  truth_key: churned_mrr_by_month_window
  abs_tol: 1.0
  scales:
  - 1
hard_rules:
- no_unknown_columns
- non_empty_or_error
- numbers_grounded
label_note: 'Domain 6: a churn is a customer paying at one month-end and absent at the next (the export lists
  paying customers only); Mar 2026 is the big-logo month (Northwind, $40,000 of $45,480).'
