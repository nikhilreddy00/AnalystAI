  seed: 1
question: What is our net revenue retention by segment over the last 12 months?
task:
  analysis_types:
  - segmentation
  target_metrics:
  - mrr
  segments:
  - segment
checks:
- kind: segment_value_truth
  planted: true
  segment: segment
  truth_key: nrr_by_segment_at_cohort
  abs_tol: 0.01
  scales:
  - 1
  - 100
hard_rules:
- no_unknown_columns
- non_empty_or_error
- numbers_grounded
label_note: 'Domain 6: NRR is a 12-month cohort (customers paying on 31 Oct 2025, their MRR now ÷ then),
  placed by their segment then: six movers SMB→Mid count in SMB. A period-sum NRR (with new customers) is 1.36, wrong.'
