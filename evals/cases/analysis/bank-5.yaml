id: bank-5
domain: banking
category: ratio
pipeline: production
dataset:
  name: loan_tape
  seed: 1
question: What's the average balance per loan by branch?
task:
  analysis_types:
  - segmentation
  target_metrics:
  - Outstanding Principal
  segments:
  - Branch
checks:
- kind: segment_value_truth
  planted: true
  segment: Branch
  truth_key: avg_balance_by_branch
  abs_tol: 1.0
  scales:
  - 1
hard_rules:
- no_unknown_columns
- non_empty_or_error
- numbers_grounded
label_note: Per loan at its latest snapshot (Oct 2026, on the books); the mean of all 14 snapshots is
  the trap.
