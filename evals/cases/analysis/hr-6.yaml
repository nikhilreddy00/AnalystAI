  seed: 1
question: How many employees did we have at the end of 2025 in each department, excluding contractors?
task:
  analysis_types:
  - segmentation
  target_metrics:
  - Employee_ID
  segments:
  - Department
checks:
- kind: segment_value_truth
  planted: true
  segment: Department
  truth_key: headcount_by_dept_2025_12_31
