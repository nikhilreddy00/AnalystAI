  - segmentation
  target_metrics:
  - Qty Shipped
  - Qty Ordered
  segments:
  - Warehouse
checks:
- kind: segment_value_truth
  planted: true
  segment: Warehouse
  truth_key: unit_fill_by_warehouse
  abs_tol: 0.005
  scales:
  - 1
  - 100
hard_rules:
- no_unknown_columns
- non_empty_or_error
- numbers_grounded
label_note: 'Domain 8 (T14-T16): units shipped over units ordered on lines past release; open lines are
  not yet judged, over-shipped units count, cancelled lines are out.'
