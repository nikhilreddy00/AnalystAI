# Employees as of a snapshot date, current and former. The share of the table who left has no
# period: it is not an attrition rate (separations in a window ÷ average headcount, the HR
# pack's attrition_rate: domain_packs/hr.yaml). Tenure of current staff is censored (they
# haven't left yet), so their tenure is a lower bound.
tables:
  - name: employees
    source: file.employees
    primary_key: [employee_id]
    columns:
      - {name: employee_id, type: id}
      - {name: department, type: dimension}
      - {name: hire_date, type: time}
      - {name: termination_date, type: time}
      - {name: left, type: fact, description: 1 if the employee left}
      - {name: tenure_months, type: fact, unit: months}
      - {name: salary, type: fact, unit: USD}
      - {name: performance_score, type: dimension}
metrics:
  - name: leaver_share
    table: employees
    expr: AVG(employees.left)
    description: share of the employees in the table (current and former) who left, over no period
  - name: average_salary
    table: employees
    expr: AVG(employees.salary)
    description: all employees in the table, current and former
  - name: average_tenure
    table: employees
    expr: AVG(employees.tenure_months)
    description: all employees in the table, current and former (current staff's tenure is a lower bound)
